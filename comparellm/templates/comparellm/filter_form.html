<form method="get" class="mb-6 flex flex-wrap gap-4 items-center">
    <label for="run" class="font-semibold">Run:</label>
    <select name="run" id="run" class="border rounded px-2 py-1" onchange="this.form.submit()">
        {% for run_file in run_files %}
            {% with forloop.counter as run_number %}
                <option value="{{ run_file }}" {% if run_file == selected_run %}selected{% endif %}>Run {{ run_number }}</option>
            {% endwith %}
        {% endfor %}
    </select>

    <label for="provider" class="font-semibold">Provider:</label>
    <select name="provider" id="provider" class="border rounded px-2 py-1" onchange="this.form.submit()">
        {% for provider in providers %}
            <option value="{{ provider }}" {% if provider == selected_provider %}selected{% endif %}>{{ provider|capfirst }}</option>
        {% endfor %}
    </select>

    <label for="model" class="font-semibold">Model:</label>
    <select name="model" id="model" class="border rounded px-2 py-1" onchange="this.form.submit()">
        {% for model, short_name in filtered_models %}
            <option value="{{ model }}" {% if model == selected_model %}selected{% endif %}>{{ short_name }}</option>
        {% endfor %}
    </select>
    <button type="submit" class="px-3 py-1 bg-blue-600 text-white rounded">Show</button>
</form>
